<!DOCTYPE html>

<head>

  <!-- No-flash viewing settings: apply saved prefs to <html> before first paint.
       Mirrors the writes in js/about.js §6 — keep the keys in sync. -->
  <script>
    (function () {
      try {
        var el = document.documentElement, ls = localStorage;
        var t = ls.getItem("viewTheme");
        if (t !== "dark" && t !== "light") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        el.setAttribute("data-theme", t);
        if (ls.getItem("viewReadability") === "1") el.setAttribute("data-readability", "1");
        if (ls.getItem("viewColorblind") === "1") el.setAttribute("data-colorblind", "1");
        if (ls.getItem("viewShowPrecollege") !== "1") el.setAttribute("data-hide-precollege", "1");
      } catch (e) { /* storage blocked — site renders in its default light theme */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

      </button>
      <button type="button" class="lang-toggle" data-lang-toggle aria-label="Toggle language (EN/ES)">
        <span class="lang-btn" data-lang="en">EN</span>
        <span class="lang-btn" data-lang="es">ES</span>
      </button>

  <div class="nav-dropdown" id="nav-dropdown" aria-hidden="true">

    <a href="experience.html" data-i18n="navExperience">Experience</a>
    <a href="about.html" data-i18n="navAbout">About</a>
  </div>

  <div class="dev-banner" data-i18n="banner">This site is under development.</div>

  <!-- §1 — Search band. Live keyword search over the §3 index (js/projects.js →
       searchEntries). Runs as the visitor types, on Enter, and on the button;
       the × clears. Combines with the tag filter (AND). Featured §2 is never
       filtered. A plain <div>, not a <form>, so Enter is handled by the script
       and can never navigate. Phase 3 swaps the body of searchEntries() for
       TF-IDF — this markup does not change. -->
  <div class="search-band" id="search-band">
    <div class="search-band-inner">
      <div class="search-field" id="project-search-field">
        <input type="search" class="search-input" id="project-search"
               data-i18n-placeholder="projSearchPlaceholder" placeholder="" autocomplete="off">
        <button type="button" class="search-clear" id="project-search-clear" aria-label="">&times;</button>
      </div>
      <button type="button" class="search-btn" id="project-search-btn" data-i18n="projSearchBtn"></button>
    </div>
  </div>

  <!-- §2 — Featured projects. Rendered from js/projects-data.js by js/projects.js:
       every entry with featured: true. The SAME array drives §3 below — a featured
       project is promoted here, not copied here, and it still appears in the index. -->
  <section class="featured-projects" id="featured-projects">
    <h2 class="section-heading" data-i18n="projFeaturedHeading"></h2>
    <div class="featured-list" id="featured-list"></div>
  </section>

  <!-- §3 — Project index. Complete listing, deliberately more compact than §2:
       the featured block above is already image-forward, so the index's job is
       coverage. Rows by default; .project-index--grid is written in style.css and
       switching to it is a class swap on #project-index — no data or markup change. -->
  <section class="project-index-section" id="project-index-section">
    <h2 class="section-heading" data-i18n="projIndexHeading"></h2>

    <div class="index-controls">
      <!-- Pills are built from the shared vocabulary in js/tags-data.js
           (translated labels, id-based state). Multi-select, AND logic. -->
      <div class="tag-filter" id="tag-filter" role="group"></div>
      <p class="index-count" id="index-count" aria-live="polite"></p>
    </div>

    <!-- Rows carry id="<slug>" so projects.html#<slug> deep-links to one. -->
    <div class="project-index project-index--rows" id="project-index"></div>

    <!-- Shown only when the filter + search combination matches nothing — never a
         blank page. Text is set by js/projects.js (projEmpty or projEmptySearch,
         depending on whether a query is active), so no data-i18n here. -->
    <p class="index-empty" id="index-empty" hidden></p>
  </section>

    <p class="footer-copy" data-i18n="footerCopyright">© 2026 Gideon A. Ong</p>
  </footer>

</body>
