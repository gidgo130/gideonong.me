  <!-- No-flash viewing settings: apply saved prefs to <html> before first paint.
       Mirrors the writes in js/about.js §6 — keep the keys in sync. -->
  <script>
    (function () {
      try {
        var el = document.documentElement, ls = localStorage;
        var t = ls.getItem("viewTheme");
        if (t !== "dark" && t !== "light") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        el.setAttribute("data-theme", t);
        if (ls.getItem("viewReadability") === "1") el.setAttribute("data-readability", "1");
        if (ls.getItem("viewColorblind") === "1") el.setAttribute("data-colorblind", "1");
        if (ls.getItem("viewShowPrecollege") !== "1") el.setAttribute("data-hide-precollege", "1");
      } catch (e) { /* storage blocked — site renders in its default light theme */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>

  <!-- §1 — Hero (2026-09-27): a solid text panel on the left and three captioned
       photo tiles that start where the panel ends — nothing sits under the text,
       so there is no scrim. Desktop: tile 1 tall, tiles 2–3 stacked. Under 768px
       the text comes first and the tiles stack below it. Captions and alts come
       from expHeroTile<N>Cap / Alt in js/translations.js. -->
  <section class="exp-hero" id="exp-hero">
    <!-- Both paragraphs are filled from js/translations.js — no display text here.
         The status line shows expHeroStatus (the no-current-role fallback) until
         js/experience.js finds an entry with status: "current", which replaces it
         with the expHeroStatusCurrent template filled from that entry. -->
    <div class="exp-hero-content">
      <p class="exp-hero-status" id="exp-hero-status" data-i18n="expHeroStatus"></p>
      <p class="exp-hero-para" data-i18n="expHeroPara"></p>
    </div>
    <div class="exp-hero-tiles">
      <figure class="exp-tile exp-tile--tall">
        <img src="assets/images/experience/hero/scanner-fixture.jpg" data-i18n-alt="expHeroTile1Alt" alt="A 3D-printed fixture on the 3D scanner's turntable">
        <figcaption class="exp-tile-caption" data-i18n="expHeroTile1Cap">3D scanner automation · Baker Hughes</figcaption>
      </figure>
      <figure class="exp-tile">
        <img src="assets/images/experience/hero/lathe-tile.jpg" data-i18n-alt="expHeroTile2Alt" alt="Machining the valve pin on a lathe">
        <figcaption class="exp-tile-caption" data-i18n="expHeroTile2Cap">Machining the valve pin · TU machine shop</figcaption>
      </figure>
      <figure class="exp-tile">
        <img src="assets/images/experience/hero/eagle-tile.jpg" data-i18n-alt="expHeroTile3Alt" alt="Gideon and volunteers building the pathway">
        <figcaption class="exp-tile-caption" data-i18n="expHeroTile3Cap">Eagle Scout pathway · build day</figcaption>
      </figure>
    </div>
  </section>

  <!-- §2 — Experience entries. Full-width bands rendered from
       js/experience-data.js by js/experience.js; each band's --entry-* colors
       are written inline from that entry's color object (per-entry values
       cannot live in :root — see the note in css/style.css §2).
       Each band carries id="<slug>" (experience.html#<slug> lands on it) and
       lists the projects from js/projects-data.js that point at it. -->
  <section class="exp-entries" id="exp-entries">
    <div class="exp-list" id="experience-list"></div>
